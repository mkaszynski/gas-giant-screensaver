name: Validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  renderer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and software-rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libglfw3-dev libgles2-mesa-dev libpng-dev xvfb python3-venv
      - name: Build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOBSERVATORY_BUILD_WEATHER_BENCHMARK=ON && cmake --build build --parallel 2
      - name: Unit and CLI tests
        run: |
          ctest --test-dir build --output-on-failure
          python3 tests/test_native_benchmark.py
          python3 scripts/tests/test_benchmark_native_guard.py
          python3 scripts/tests/test_workload_sampler.py
      - name: Offline galaxy model behavior
        run: |
          python3 -m venv /tmp/sky-model-tests
          /tmp/sky-model-tests/bin/pip install -r scripts/sky-model-requirements.txt
          /tmp/sky-model-tests/bin/pip install -r scripts/terrain-requirements.txt
          /tmp/sky-model-tests/bin/python tests/test_galaxy_model.py
          /tmp/sky-model-tests/bin/python tests/test_terrain_bake.py
          /tmp/sky-model-tests/bin/python tests/test_world_bake.py
          /tmp/sky-model-tests/bin/python tests/test_surface_materials.py
          /tmp/sky-model-tests/bin/python tests/test_landform_bake.py
      - name: Frame-profile analysis tests
        run: python3 tests/test_frame_profile.py
      - name: GPU behavior on Mesa software renderer
        run: |
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/render-tests
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/ring-render-tests
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/edge-render-tests
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/atmosphere-render-tests
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/scattering-edge-tests
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/emission-render-tests
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/sky-render-tests
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/terrain-render-tests
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/surface-render-tests
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/debug-render-tests
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/surface-shadow-tests
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/fidelity-render-tests
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/water-render-tests
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/weather-render-tests
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/weather-specialization-tests
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 python3 tests/test_benchmark_output.py
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 python3 tests/test_weather_benchmark.py
      - name: Render daylight and twilight
        run: |
          mkdir -p captures
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/gas-giant-screensaver --capture captures/day.png --time 510 --travel-time 162000 --weather-time 1790900000 --width 960 --height 540
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/gas-giant-screensaver --capture captures/twilight.png --time 1180 --travel-time 0 --width 960 --height 540
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/gas-giant-screensaver --capture captures/weather-storm.png --time 510 --travel-time 162000 --weather-time 1260 --width 960 --height 540
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/gas-giant-screensaver --capture captures/weather-lightning.png --time 1200 --travel-time 162000 --weather-time 1512.8 --width 960 --height 540
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/gas-giant-screensaver --capture captures/galaxy-eclipse.png --fixed-view --time 437625 --width 1920 --height 1080
      - uses: actions/upload-artifact@v4
        with:
          name: software-rendered-captures
          path: captures/*.png
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build preview, Hyprlock and validate configuration
        run: nix flake check --print-build-logs --cores 2
