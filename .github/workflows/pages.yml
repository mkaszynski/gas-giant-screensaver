name: WebAssembly preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.12'
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install offline shader tools
        run: sudo apt-get update && sudo apt-get install -y glslang-tools spirv-cross
      - name: Shader conversion and uniform data tests
        run: |
          python3 tests/test_webgpu_shaders.py
          node tests/webgpu_data.cjs
      - name: Build the shared C++ renderer
        run: |
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web --parallel 2
      - name: Install browser checks
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise both graphics backends and automatic fallback
        run: |
          PREVIEW_BACKEND=webgl2 npm test --prefix web
          PREVIEW_BACKEND=webgpu npm test --prefix web
          node tests/web_backend_parity.cjs
          PREVIEW_BACKEND=auto npm test --prefix web
      - name: Package only static runtime assets
        run: |
          mkdir -p site
          cp build-web/observatory.{js,wasm,data} build-web/index.html build-web/preview.{js,css} build-web/isolation-worker.js build-web/render-worker.js build-web/graphics-data.js build-web/webgpu-context.js build-web/webgpu-shaders.json build-web/LICENSE site/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: captures/web-*
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  verify-live:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser checks
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify the published Pages preview
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          PREVIEW_BACKEND=webgl2 npm test --prefix web
          PREVIEW_BACKEND=webgpu npm test --prefix web
          node tests/web_backend_parity.cjs
          PREVIEW_BACKEND=auto npm test --prefix web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-browser-validation
          path: captures/web-*
