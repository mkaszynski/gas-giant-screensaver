name: WebAssembly preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.12'
          actions-cache-folder: emsdk-cache
      - name: Build the shared C++ renderer
        run: |
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web --parallel 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser checks
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise static preview in a browser
        run: npm test --prefix web
      - name: Package only static runtime assets
        run: |
          mkdir -p site
          cp build-web/observatory.{js,wasm,data} build-web/index.html build-web/preview.{js,css} build-web/isolation-worker.js build-web/LICENSE site/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: captures/web-*
  deploy:
    if: github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
