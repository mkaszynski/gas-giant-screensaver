name: WebAssembly preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.12'
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install offline shader tools
        run: sudo apt-get update && sudo apt-get install -y glslang-tools spirv-cross
      - name: Shader conversion and uniform data tests
        run: |
          python3 tests/test_webgpu_shaders.py
          node tests/webgpu_data.cjs
          node tests/gpu_memory.cjs
          python3 tests/test_web_assets.py
          python3 tests/test_browser_budget.py
      - name: Build the shared C++ renderer
        run: |
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web --parallel 2
      - name: Install browser checks
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise both graphics backends and automatic fallback
        run: |
          PREVIEW_BACKEND=webgl2 npm test --prefix web
          PREVIEW_BACKEND=webgpu npm test --prefix web
          node tests/web_backend_parity.cjs
          PREVIEW_BACKEND=auto npm test --prefix web
      - name: Package only static runtime assets
        run: |
          mkdir -p site
          cp build-web/observatory.{js,wasm,data} build-web/index.html build-web/preview.{js,css} build-web/isolation-worker.js build-web/render-worker.js build-web/graphics-data.js build-web/gpu-memory.js build-web/webgpu-context.js build-web/webgpu-shaders.json build-web/assets.json build-web/LICENSE site/
          cp -r build-web/assets site/assets
      - uses: actions/upload-artifact@v4
        with:
          name: web-runtime
          path: site
          retention-days: 3
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: captures/web-*
  memory:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.12'
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install shader and headless browser tools
        run: |
          sudo apt-get update && sudo apt-get install -y glslang-tools spirv-cross
          npm ci --prefix web
          cd web && npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: web-runtime
          path: build-web
      - name: Build the pre-change renderer for comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          git worktree add --detach /tmp/observatory-before "$BASE_SHA"
          emcmake cmake -S /tmp/observatory-before -B build-before -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-before --parallel 2
      - name: Verify the kernel memory ceiling
        run: |
          mkdir -p captures
          if sudo python3 scripts/browser_budget.py --report captures/web-budget-oom-check.json --memory-mib 128 --seconds 20 -- "$(command -v node)" -e 'new Uint8Array(256*1024*1024).fill(1)'; then
            echo "The resource ceiling did not stop an oversized allocation"
            exit 1
          fi
          python3 -c 'import json; assert "Result=oom-kill" in json.load(open("captures/web-budget-oom-check.json"))["summary"]'
      - name: Sequential feature isolation under hard resource limits
        run: |
          for backend in webgl2 webgpu; do
            for version in before after; do
              if [ "$version" = before ]; then profile_build=build-before; else profile_build=build-web; fi
              sudo python3 scripts/browser_budget.py --report "captures/web-budget-$version-$backend.json" --memory-mib 3072 --cpu-percent 200 --seconds 900 -- env PREVIEW_BACKEND="$backend" PROFILE_VERSION="$version" PROFILE_BUILD="$profile_build" PROFILE_REPORT="captures/web-memory-$version-$backend.json" "$(command -v node)" tests/web_memory_profile.cjs
            done
          done
      - name: Validate and summarize memory contracts
        run: |
          python3 scripts/summarize_web_memory.py > captures/web-memory-summary.md
          cat captures/web-memory-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-memory-profiles
          path: |
            captures/web-*.json
            captures/web-memory-summary.md
  deploy:
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.web.result == 'success' && (needs.memory.result == 'success' || needs.memory.result == 'skipped')
    needs: [web, memory]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  verify-live:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser checks
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify the published Pages preview
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          PREVIEW_BACKEND=webgl2 npm test --prefix web
          PREVIEW_BACKEND=webgpu npm test --prefix web
          node tests/web_backend_parity.cjs
          PREVIEW_BACKEND=auto npm test --prefix web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-browser-validation
          path: captures/web-*
